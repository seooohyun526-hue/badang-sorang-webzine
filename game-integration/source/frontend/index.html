<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#082e43"><title>해녀의 바당길 · 온라인 해양 정화</title>
<link rel="preload" href="Fonts/MonaS12-Bold.otf" as="font" type="font/otf" crossorigin>
<style>@font-face{font-family:Mona;src:url("Fonts/MonaS12-Bold.otf") format("opentype");font-weight:400;font-display:swap}@font-face{font-family:MonaRegular;src:url("Fonts/MonaS12.otf") format("opentype");font-weight:400;font-display:swap}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#051b2b;color:#e7faf5;font-family:MonaRegular,system-ui,sans-serif;font-synthesis:none}body{display:grid;place-items:center;background:radial-gradient(ellipse at top,#124d60,#051b2b 72%)}#game{width:min(100vw,calc(100dvh * .57));height:100dvh;position:relative;box-shadow:0 0 100px #0008}canvas{width:100%;height:100%;display:block;touch-action:none;outline:0}#loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center;background:#08324e}small{letter-spacing:3px;color:#75f2c9}h1{font-family:Mona,sans-serif;font-weight:400;font-size:38px;line-height:1.3;margin:20px 0}progress{width:220px;height:8px;accent-color:#75f2c9}p{font-size:14px;line-height:1.7;color:#b5d7dd}#error{display:none;color:#ffdab1;white-space:pre-wrap;overflow-wrap:anywhere}button{border:0;border-radius:8px;background:#75f2c9;color:#092c40;padding:14px 24px;font-family:Mona,sans-serif;font-size:16px;font-weight:400}#retry{display:none}@media(min-aspect-ratio:1/1){#game{border-left:1px solid #ffffff15;border-right:1px solid #ffffff15}}</style><link rel="stylesheet" href="online.css"></head>
<body><main id="game"><canvas id="unity-canvas" tabindex="0" aria-label="해녀의 바당길 게임"></canvas><section id="loading"><small>HAENYEO / CLEAN OCEAN</small><h1>해녀의<br>바당길</h1><p id="status">바닷속을 준비하고 있어요</p><progress id="progress" value="0" max="1"></progress><p id="error"></p><button id="retry" onclick="location.reload()">다시 불러오기</button></section></main>
<script src="online.js"></script><script>const loader=document.createElement('script');loader.src='Build/Web.loader.js';const fail=e=>{document.getElementById('status').textContent='게임을 불러오지 못했어요';document.getElementById('error').style.display='block';document.getElementById('error').textContent=String(e);document.getElementById('retry').style.display='block'};loader.onerror=()=>fail('인터넷 연결을 확인한 뒤 다시 시도해 주세요.');loader.onload=()=>createUnityInstance(document.querySelector('canvas'),{dataUrl:'Build/Web.data.unityweb',frameworkUrl:'Build/Web.framework.js.unityweb',codeUrl:'Build/Web.wasm.unityweb',streamingAssetsUrl:new URL('StreamingAssets',document.baseURI).href,companyName:'Haenyeo Studio',productName:'Haenyeo Online',productVersion:'0.1.1',cacheControl:()=> 'no-store',devicePixelRatio:Math.min(window.devicePixelRatio||1,1.5)},p=>document.getElementById('progress').value=p).then(instance=>{window.unityInstance=instance;document.getElementById('loading').style.display='none';document.querySelector('canvas').focus()}).catch(fail);if(location.protocol==='file:'){fail('HTML 파일을 직접 열면 실행되지 않습니다. 프로젝트 폴더의 게임-실행.cmd를 더블클릭해 주세요.');document.getElementById('retry').style.display='none';}else{document.body.appendChild(loader);}</script></body></html>
